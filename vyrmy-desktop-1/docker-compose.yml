version: "3.7"

services:
  # Umbrel's login stays on for the port on the Umbrel, so only the person this app is
  # shared with (and the owner) can open it there. Edge sends its hostname straight to
  # the container instead, behind Authentik (ARCHITECTURE.md, decision 15).
  app_proxy:
    environment:
      APP_HOST: vyrmy-desktop-1_desktop_1
      APP_PORT: 3000

  desktop:
    # Built from desktop/ in this repo. scripts/pin-desktop-image updates the digest.
    image: ghcr.io/vyrmy/umbrel-desktop:main@sha256:488ff52da04498efb6f7a58cf08a3b7a62e9b64cbc2901dfee235add84e1b7f4
    restart: on-failure
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/London
      LC_ALL: en_GB.UTF-8
      TITLE: Desktop 1
      # The image is rebuilt rather than patched in place, so nobody needs root in here.
      DISABLE_SUDO: "true"
      # Webtop turns Selkies' command messages on for its launcher, which lets anyone who
      # can open the stream run shell commands. Nothing here uses the launcher.
      SELKIES_COMMAND_ENABLED: "false|locked"
      # Uploads and downloads through the stream, to and from /config/Desktop.
      SELKIES_FILE_TRANSFERS: "none"
      # Session links would let a second browser watch or drive this desktop. On the
      # websocket transport, viewers and extra players are refused only with the last four.
      SELKIES_ENABLE_SHARING: "false|locked"
      SELKIES_ENABLE_SHARED: "false|locked"
      SELKIES_ENABLE_PLAYER2: "false|locked"
      SELKIES_ENABLE_PLAYER3: "false|locked"
      SELKIES_ENABLE_PLAYER4: "false|locked"
      # Empty: only pages on the desktop's own host name (any port) may open the stream's
      # websocket. Webtop's default, "*", lets any site the person visits try.
      SELKIES_ALLOWED_ORIGINS: ""
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    shm_size: "1gb"
    # Docker's seccomp filter stays on. Without it Chromium and Signal try their own
    # sandboxes, which need unprivileged user namespaces, and the Umbrel's kernel refuses
    # them (credentials.cc: Permission denied), so both crashed at start. With the filter
    # on, both launchers use --no-sandbox, as Umbrel's own Chromium app does.
