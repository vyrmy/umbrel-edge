# Golden file for a route protected by Authentik forward auth (decision 14).
middlewares:
  authentik:
    forwardAuth:
      address: http://host.docker.internal:9000/outpost.goauthentik.io/auth/traefik
      authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
      trustForwardHeader: true
routers:
  app-jellyfin:
    entryPoints:
    - websecure
    middlewares:
    - authentik
    rule: Host(`jellyfin.bebitwise.dev`)
    service: app-jellyfin
    tls:
      certResolver: cloudflare
      domains:
      - main: bebitwise.dev
        sans:
        - '*.bebitwise.dev'
  outpost-jellyfin:
    entryPoints:
    - websecure
    priority: 1000
    rule: Host(`jellyfin.bebitwise.dev`) && PathPrefix(`/outpost.goauthentik.io/`)
    service: authentik-outpost
    tls:
      certResolver: cloudflare
      domains:
      - main: bebitwise.dev
        sans:
        - '*.bebitwise.dev'
services:
  authentik-outpost:
    loadBalancer:
      passHostHeader: true
      servers:
      - url: http://host.docker.internal:9000
