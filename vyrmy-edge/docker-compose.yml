version: "3.7"

services:
  app_proxy:
    environment:
      # Traefik dashboard, reachable only through Umbrel's own login.
      APP_HOST: vyrmy-edge_traefik_1
      APP_PORT: 8080

  # Prepares the data folder before anything else starts. Reuses the Traefik image (Alpine)
  # so nothing extra is pulled.
  # - Docker creates a missing bind-mount source as root, but sync runs as uid 1000, so the
  #   directories sync writes to are made here and given to it.
  # - Traefik and cloudflared face the internet, so each gets only its own key from
  #   secrets.env, as a file rewritten on every start, and neither mounts the data folder.
  #   secrets.env stays the one file to edit; restart the app after changing it.
  init:
    image: traefik:v3.7.13
    restart: "no"
    user: "0:0"
    entrypoint:
      - sh
      - -euc
      - |
        umask 077
        mkdir -p /data/traefik/dynamic /data/state /data/acme /data/secrets/traefik /data/secrets/cloudflared
        chown 1000:1000 /data/traefik /data/traefik/dynamic /data/state
        # Edge 0.4.0 and earlier kept the certificate store at /data/acme.json.
        if [ -f /data/acme.json ] && [ ! -e /data/acme/acme.json ]; then
          cp -p /data/acme.json /data/acme/acme.json
        fi
        # secret KEY FILE UID: KEY's value in secrets.env, read as Compose's env_file read it
        # (last line wins; export prefix, spaces around =, quotes and # comments), readable by
        # UID only. Empty when the key or the file is missing, as an unset variable was.
        secret() {
          value=$$(awk -v k="$$1" '
            { sub(/\r$$/, "") }
            {
              line = $$0
              sub(/^[ \t]*(export[ \t]+)?/, "", line)
              if (index(line, k) != 1) next
              rest = substr(line, length(k) + 1)
              if (rest !~ /^[ \t]*=/) next
              sub(/^[ \t]*=[ \t]*/, "", rest)
              q = substr(rest, 1, 1)
              if (q == "\"" || q == "\047") {
                e = index(substr(rest, 2), q)
                v = e ? substr(rest, 2, e - 1) : substr(rest, 2)
              } else {
                v = rest
                sub(/[ \t]+#.*$$/, "", v)
                sub(/[ \t]+$$/, "", v)
              }
              val = v
            }
            END { printf "%s", val }' /data/secrets.env 2>/dev/null || true)
          printf '%s' "$$value" >"$$2.new"
          chown "$$3:$$3" "$$2.new"
          chmod 0400 "$$2.new"
          mv -f "$$2.new" "$$2"
        }
        secret CF_DNS_API_TOKEN /data/secrets/traefik/cf_dns_api_token 0
        # cloudflared's image runs as nonroot, uid 65532.
        secret TUNNEL_TOKEN /data/secrets/cloudflared/tunnel_token 65532
        chown 65532:65532 /data/secrets/cloudflared
    volumes:
      - ${APP_DATA_DIR}/data:/data
    network_mode: none

  traefik:
    image: traefik:v3.7.13
    restart: on-failure
    depends_on:
      init:
        condition: service_completed_successfully
    # All static configuration is here rather than in a file: an app update only copies
    # docker-compose.yml (and a few other files) into app-data, never other folders.
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=INFO
      # No access log: URLs can carry tokens in the query string. Add --accesslog=true
      # briefly when debugging.
      - --api.dashboard=true
      - --api.insecure=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      # Strip headers whose names alias others (X_authentik_email for X-Authentik-Email),
      # so a client cannot spoof the identity headers forward auth sets (Traefik 3.7.12+).
      - --entrypoints.websecure.http.aliasHeadersStrategy=delete
      # Refuse encoded backslashes, nulls and semicolons in paths: no app here needs them,
      # and they can make a path look like an Authentik skip path (^/api/...) to the outpost
      # while meaning another path to an app that decodes it. Encoded slashes and percent
      # signs stay allowed, since real app URLs carry them (a file name containing %).
      - --entrypoints.websecure.http.encodedCharacters.allowEncodedBackSlash=false
      - --entrypoints.websecure.http.encodedCharacters.allowEncodedNullCharacter=false
      - --entrypoints.websecure.http.encodedCharacters.allowEncodedSemicolon=false
      - --entrypoints.websecure.http.tls.certresolver=cloudflare
      - --entrypoints.websecure.http.tls.domains[0].main=bebitwise.dev
      - --entrypoints.websecure.http.tls.domains[0].sans=*.bebitwise.dev
      # cloudflared's way in, listening only on Traefik's edge address, so nothing on the LAN,
      # the main network or a desktop can reach it (decision 19). Only routes with external
      # set answer here. The same hardening as websecure, flag for flag.
      - --entrypoints.tunnel.address=10.30.0.2:8443
      - --entrypoints.tunnel.http.aliasHeadersStrategy=delete
      - --entrypoints.tunnel.http.encodedCharacters.allowEncodedBackSlash=false
      - --entrypoints.tunnel.http.encodedCharacters.allowEncodedNullCharacter=false
      - --entrypoints.tunnel.http.encodedCharacters.allowEncodedSemicolon=false
      # The same, for routes with real_ip only (decision 20): it trusts the forwarded headers
      # cloudflared passes on and adds none, so X-Forwarded-For ends with the address
      # Cloudflare saw. sync's realip-<id> middleware pins or drops the other X-Forwarded-*.
      - --entrypoints.tunnel-realip.address=10.30.0.2:8444
      - --entrypoints.tunnel-realip.http.aliasHeadersStrategy=delete
      - --entrypoints.tunnel-realip.http.encodedCharacters.allowEncodedBackSlash=false
      - --entrypoints.tunnel-realip.http.encodedCharacters.allowEncodedNullCharacter=false
      - --entrypoints.tunnel-realip.http.encodedCharacters.allowEncodedSemicolon=false
      - --entrypoints.tunnel-realip.forwardedHeaders.trustedIPs=10.30.0.0/24
      - --entrypoints.tunnel-realip.forwardedHeaders.notAppendXForwardedFor=true
      # Dashboard for the Umbrel app page. Reached only from umbreld's app proxy.
      - --entrypoints.dashboard.address=:8080
      - --certificatesresolvers.cloudflare.acme.storage=/data/acme/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53
      # Body rewrite for the Umbrel dashboard launcher (task 007), downloaded at start.
      # If the download or load fails, Traefik logs "Plugins are disabled" and starts
      # anyway; only the umbrel router is dropped, and sync's fallback router serves the
      # dashboard without the launcher.
      - --experimental.abortonpluginfailure=false
      - --experimental.plugins.rewrite-body.modulename=github.com/packruler/rewrite-body
      - --experimental.plugins.rewrite-body.version=v1.2.0
      - --providers.file.directory=/data/traefik/dynamic
      - --providers.file.watch=true
    environment:
      # lego, Traefik's ACME client, reads <VAR>_FILE when <VAR> itself is unset.
      CF_DNS_API_TOKEN_FILE: /run/secrets/edge/cf_dns_api_token
    # Only what Traefik needs: the certificate store, sync's routes (read-only) and its token.
    volumes:
      - ${APP_DATA_DIR}/data/acme:/data/acme
      - ${APP_DATA_DIR}/data/traefik/dynamic:/data/traefik/dynamic:ro
      - ${APP_DATA_DIR}/data/secrets/traefik:/run/secrets/edge:ro
    extra_hosts:
      # The host, as seen from umbrel_main_network. umbrelOS exports GATEWAY_IP to compose.
      # host-gateway would resolve to docker0, which is not directly attached here,
      # so once the default route is on the LAN it would be sent to the UniFi gateway.
      - "host.docker.internal:${GATEWAY_IP:-10.21.0.1}"
    networks:
      default:
        # Apps on umbrel_main_network reach these names at Traefik through Docker's DNS,
        # since nothing on the Umbrel can reach 192.168.10.4 (macvlan parent isolation).
        # OIDC apps need it for back-channel calls to Authentik.
        aliases:
          - auth.bebitwise.dev
      # Fixed, because the tunnel entrypoint binds to it.
      edge:
        ipv4_address: 10.30.0.2
      lan:
        ipv4_address: 192.168.10.4
        # Per network: a service-level mac_address lands on the first network (default).
        mac_address: "02:42:c0:a8:0a:04"
        # Default route via 192.168.10.1, so replies to Main and VPN clients leave from
        # 192.168.10.4 rather than being NATed out through the host. Needs Engine 28+.
        gw_priority: 1
      # One private network per desktop slot (decision 17): Traefik is the slot's only way in.
      desk-1:
        ipv4_address: 10.31.1.2
      desk-2:
        ipv4_address: 10.31.2.2
      # new-desktop-slot: Traefik desk networks end here.

  # Outbound-only tunnel connector. Ingress comes from the Cloudflare API (written by sync),
  # so there is no config file. It reaches Traefik's tunnel entrypoint by name over the edge
  # bridge, at https://traefik:8443.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    # Exits without a token; Docker's backoff caps retries at one a minute until it is set.
    restart: on-failure
    depends_on:
      init:
        condition: service_completed_successfully
    command: tunnel --no-autoupdate run --token-file /run/secrets/edge/tunnel_token
    volumes:
      - ${APP_DATA_DIR}/data/secrets/cloudflared:/run/secrets/edge:ro
    networks:
      edge: {}

  sync:
    image: ghcr.io/vyrmy/umbrel-edge-sync:main@sha256:eaaf1dde0b927c9d390bfd6905ea6d36df74182e5407f578becf5ee5f74e7302
    restart: on-failure
    depends_on:
      init:
        condition: service_completed_successfully
    env_file:
      - path: ${APP_DATA_DIR}/data/secrets.env
        required: false
    environment:
      EDGE_CONFIG: /data/edge.yaml
      EDGE_APP_DATA_ROOT: /umbrel/app-data
      EDGE_TRAEFIK_DYNAMIC_DIR: /data/traefik/dynamic
      EDGE_STATE_DIR: /data/state
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # The Umbrel data directory, read-only, for discovery: app-data/<id>/umbrel-app.yml, and
      # umbrel.yaml, where umbreld lists the installed apps under `apps`. The directory, because
      # umbreld replaces umbrel.yaml by rename and a mount of the file alone would go stale.
      - ${APP_DATA_DIR}/../..:/umbrel:ro
    networks:
      edge: {}

networks:
  # Traefik, cloudflared and sync. A fixed subnet for Traefik's tunnel address; Compose
  # recreates the network when this changes, since only Edge's own containers use it.
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 10.30.0.0/24
  lan:
    driver: macvlan
    driver_opts:
      parent: enp2s0
    ipam:
      config:
        - subnet: 192.168.10.0/24
          gateway: 192.168.10.1
          ip_range: 192.168.10.4/32
  # Desktop slot n joins vyrmy-edge_desk-<n> as an external network, alone with Traefik and its
  # own egress proxy (decisions 17 and 18). internal: no route out. inhibit_ipv4: the bridge
  # gets no host address, so the host cannot reach the desktop and the desktop cannot reach
  # host services on the bridge. Never change a shipped desk network: Compose cannot recreate
  # one that a running desktop is attached to, so Edge would fail to start.
  desk-1:
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: 10.31.1.0/24
  desk-2:
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: 10.31.2.0/24
  # new-desktop-slot: desk network definitions end here.
