version: "3.7"

services:
  app_proxy:
    environment:
      # Traefik dashboard, reachable only through Umbrel's own login.
      APP_HOST: vyrmy-edge_traefik_1
      APP_PORT: 8080

  # Docker creates a missing bind-mount source as root, but sync runs as uid 1000.
  # Make sure the directories sync writes to exist and belong to it. Reuses the
  # Traefik image (Alpine) so nothing extra is pulled.
  init:
    image: traefik:v3.7.13
    restart: "no"
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - mkdir -p /data/traefik/dynamic /data/state && chown 1000:1000 /data/traefik /data/traefik/dynamic /data/state
    volumes:
      - ${APP_DATA_DIR}/data:/data
    network_mode: none

  traefik:
    image: traefik:v3.7.13
    restart: on-failure
    depends_on:
      init:
        condition: service_completed_successfully
    # All static configuration is here rather than in a file: an app update only copies
    # docker-compose.yml (and a few other files) into app-data, never other folders.
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=INFO
      - --accesslog=true
      - --api.dashboard=true
      - --api.insecure=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=cloudflare
      - --entrypoints.websecure.http.tls.domains[0].main=bebitwise.dev
      - --entrypoints.websecure.http.tls.domains[0].sans=*.bebitwise.dev
      # Dashboard for the Umbrel app page. Reached only from umbreld's app proxy.
      - --entrypoints.dashboard.address=:8080
      - --certificatesresolvers.cloudflare.acme.storage=/data/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53
      # Body rewrite for the Umbrel dashboard launcher (task 007), downloaded at start.
      # If the download or load fails, Traefik logs "Plugins are disabled" and starts
      # anyway; only the umbrel router is dropped, and sync's fallback router serves the
      # dashboard without the launcher.
      - --experimental.abortonpluginfailure=false
      - --experimental.plugins.rewrite-body.modulename=github.com/packruler/rewrite-body
      - --experimental.plugins.rewrite-body.version=v1.2.0
      - --providers.file.directory=/data/traefik/dynamic
      - --providers.file.watch=true
    env_file:
      - path: ${APP_DATA_DIR}/data/secrets.env
        required: false
    volumes:
      - ${APP_DATA_DIR}/data:/data
    extra_hosts:
      # The host, as seen from umbrel_main_network. umbrelOS exports GATEWAY_IP to compose.
      # host-gateway would resolve to docker0, which is not directly attached here,
      # so once the default route is on the LAN it would be sent to the UniFi gateway.
      - "host.docker.internal:${GATEWAY_IP:-10.21.0.1}"
    networks:
      default: {}
      edge: {}
      lan:
        ipv4_address: 192.168.10.4
        # Per network: a service-level mac_address lands on the first network (default).
        mac_address: "02:42:c0:a8:0a:04"
        # Default route via 192.168.10.1, so replies to Main and VPN clients leave from
        # 192.168.10.4 rather than being NATed out through the host. Needs Engine 28+.
        gw_priority: 1

  # A macvlan child cannot talk to its parent interface, so the Umbrel host, and every app
  # behind its NAT, cannot reach 192.168.10.4. This gives the host its own macvlan interface
  # on enp2s0, 192.168.10.5, and a /32 route to the proxy through it. Apps then reach
  # <app>.bebitwise.dev the same way LAN clients do: OIDC back-channel calls to Authentik,
  # and Uptime Kuma's monitors. Removed again when the container stops.
  lan-shim:
    image: traefik:v3.7.13
    restart: on-failure
    network_mode: host
    cap_add:
      - NET_ADMIN
    entrypoint:
      - sh
      - -c
      - |
        set -e
        down() { ip link del edge-shim 2>/dev/null || true; echo "edge-shim removed"; exit 0; }
        trap down TERM INT
        ip link del edge-shim 2>/dev/null || true
        ip link add edge-shim link enp2s0 type macvlan mode bridge
        ip link set edge-shim address 02:42:c0:a8:0a:05
        ip addr add 192.168.10.5/32 dev edge-shim
        ip link set edge-shim up
        ip route replace 192.168.10.4/32 dev edge-shim src 192.168.10.5
        echo "edge-shim up: this host reaches 192.168.10.4 from 192.168.10.5"
        sleep 2147483647 & wait

  # Outbound-only tunnel connector. Ingress comes from the Cloudflare API (written by sync),
  # so there is no config file. It reaches Traefik by name over the edge bridge.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    # Exits without TUNNEL_TOKEN; Docker's backoff caps retries at one a minute until it is set.
    restart: on-failure
    command: tunnel --no-autoupdate run
    env_file:
      - path: ${APP_DATA_DIR}/data/secrets.env
        required: false
    networks:
      edge: {}

  sync:
    image: ghcr.io/vyrmy/umbrel-edge-sync:main@sha256:7a080364d7ba7527b4f8c46137cc489b47e1e533ef282342fde4d35fcf092d64
    restart: on-failure
    depends_on:
      init:
        condition: service_completed_successfully
    env_file:
      - path: ${APP_DATA_DIR}/data/secrets.env
        required: false
    environment:
      EDGE_CONFIG: /data/edge.yaml
      EDGE_APP_DATA_ROOT: /umbrel/app-data
      EDGE_TRAEFIK_DYNAMIC_DIR: /data/traefik/dynamic
      EDGE_STATE_DIR: /data/state
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # The Umbrel data directory, read-only, for discovery: app-data/<id>/umbrel-app.yml, and
      # umbrel.yaml, where umbreld lists the installed apps under `apps`. The directory, because
      # umbreld replaces umbrel.yaml by rename and a mount of the file alone would go stale.
      - ${APP_DATA_DIR}/../..:/umbrel:ro
    networks:
      edge: {}

networks:
  edge:
    driver: bridge
  lan:
    driver: macvlan
    driver_opts:
      parent: enp2s0
    ipam:
      config:
        - subnet: 192.168.10.0/24
          gateway: 192.168.10.1
          ip_range: 192.168.10.4/32
