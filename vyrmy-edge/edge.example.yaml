# Copy to ${APP_DATA_DIR}/data/edge.yaml on the Umbrel and edit.
# sync re-reads it within a few seconds of any change.

domain: bebitwise.dev
proxy_ip: 192.168.10.4

# Applied to every app unless overridden under `apps`.
defaults:
  internal: true    # UniFi A record <app>.bebitwise.dev -> proxy_ip
  external: true    # Cloudflare Tunnel hostname
  access: true      # Cloudflare Access in front of the tunnel hostname
  forward_auth: false  # Authentik login in front of the hostname, at home and away

# Never external unless apps.<id>.external is set explicitly.
external_deny:
  - home-assistant
  - portainer
  - arcane
  - code-server
  - termix
  - denny-olivetin
  - torbrowser
  - denny-librewolf
  - wireguard
  - tailscale
  - vyrmy-edge
  - umbrel          # the Umbrel dashboard: it installs apps and opens a host terminal

# Never behind forward auth unless apps.<id>.forward_auth is set explicitly.
# Authentik serves the login, so protecting it would lock everyone out.
forward_auth_deny:
  - authentik
  - denny-authentik

# Never reachable from a desktop unless apps.<id>.desktops is set explicitly
# (ARCHITECTURE.md, decision 22). The desktops still open every other app.
desktop_deny:
  - umbrel          # the dashboard
  - vyrmy-edge      # Edge's own page

# Ignored entirely: no route, no records.
exclude:
  - mosquitto

access:
  allowed_emails:
    - you@example.com
  session_duration: 24h

# Authentik forward auth (ARCHITECTURE.md, decision 14). Needed once any app sets
# forward_auth: true. In Authentik, give each protected app a Proxy provider in
# forward auth mode with its external host, and assign it to the embedded outpost.
# Turn Umbrel app auth off for each protected app and for Authentik itself.
# Point both at Authentik's server container on umbrel_main_network, not at the
# Umbrel app port: umbrelOS's app proxy drops X-Forwarded-Host, which the outpost
# needs to tell apps apart.
# forward_auth:
#   address: http://denny-authentik_server_1:9000/outpost.goauthentik.io/auth/traefik
#   outpost_url: http://denny-authentik_server_1:9000
#   # response_headers defaults to the X-authentik-* list from Authentik's Traefik docs.

# Per-app overrides, keyed by Umbrel app id.
apps: {}
