global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

accessLog: {}

api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: cloudflare
        domains:
          - main: bebitwise.dev
            sans: ["*.bebitwise.dev"]
  # Dashboard for the Umbrel app page. Reached only by app_proxy.
  dashboard:
    address: ":8080"

certificatesResolvers:
  cloudflare:
    acme:
      storage: /data/acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers: ["1.1.1.1:53", "1.0.0.1:53"]

# Body rewrite for the Umbrel dashboard launcher (task 007). Traefik downloads the plugin from
# GitHub at start, so it needs internet access then. If the download fails Traefik exits.
experimental:
  plugins:
    rewrite-body:
      moduleName: github.com/packruler/rewrite-body
      version: v1.2.0

providers:
  file:
    directory: /data/traefik/dynamic
    watch: true
