manifestVersion: 1
id: vyrmy-edge
name: Edge
tagline: HTTPS hostnames for every app, at home and away
icon: https://raw.githubusercontent.com/traefik/traefik/master/docs/content/assets/img/traefik.logo.png
category: networking
version: "0.5.1"
port: 18080
description: >-
  Gives every app on this Umbrel its own hostname under bebitwise.dev, with a
  Let's Encrypt certificate. At home the name resolves to a Traefik proxy on
  192.168.10.4. Away, it goes through a Cloudflare Tunnel behind Cloudflare
  Access.


  Routes, UniFi DNS records, tunnel hostnames and Access applications follow
  the installed apps automatically. Configuration lives in edge.yaml in the
  app's data folder.


  This page is the Traefik dashboard.
developer: vyrmy
website: https://github.com/vyrmy/umbrel-edge
submitter: vyrmy
submission: https://github.com/vyrmy/umbrel-edge
repo: https://github.com/vyrmy/umbrel-edge
support: https://github.com/vyrmy/umbrel-edge/issues
gallery: []
releaseNotes: >-
  Two settings in edge.yaml, both off until you set them.


  access.team_name, your Zero Trust team name: cloudflared then refuses any
  request through the tunnel without a valid Cloudflare Access login, so a
  deleted or changed Access app no longer leaves its address open.


  apps.home-assistant.real_ip, with external: true: Home Assistant then sees
  each visitor's own address, so its local-only webhooks and users refuse
  the internet. Set use_x_forwarded_for and trusted_proxies (10.21.0.0/16)
  under http: in Home Assistant's configuration.yaml first, or it will
  refuse every request that comes through the tunnel.
dependencies: []
path: "/dashboard/"
defaultUsername: ""
defaultPassword: ""
