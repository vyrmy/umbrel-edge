manifestVersion: 1
id: vyrmy-edge
name: Edge
tagline: HTTPS hostnames for every app, at home and away
icon: https://raw.githubusercontent.com/traefik/traefik/master/docs/content/assets/img/traefik.logo.png
category: networking
version: "0.4.0"
port: 18080
description: >-
  Gives every app on this Umbrel its own hostname under bebitwise.dev, with a
  Let's Encrypt certificate. At home the name resolves to a Traefik proxy on
  192.168.10.4. Away, it goes through a Cloudflare Tunnel behind Cloudflare
  Access.


  Routes, UniFi DNS records, tunnel hostnames and Access applications follow
  the installed apps automatically. Configuration lives in edge.yaml in the
  app's data folder.


  This page is the Traefik dashboard.
developer: vyrmy
website: https://github.com/vyrmy/umbrel-edge
submitter: vyrmy
submission: https://github.com/vyrmy/umbrel-edge
repo: https://github.com/vyrmy/umbrel-edge
support: https://github.com/vyrmy/umbrel-edge/issues
gallery: []
releaseNotes: >-
  An app's hostname can now go straight to the app's container, with
  upstream_host in edge.yaml. Umbrel's login then stays on for the app's own
  port, and the hostname sits behind Authentik unless you turn that off. The
  new Desktop apps use it, so each person's desktop opens only for them.
dependencies: []
path: "/dashboard/"
defaultUsername: ""
defaultPassword: ""
