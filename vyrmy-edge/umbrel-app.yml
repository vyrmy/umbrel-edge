manifestVersion: 1
id: vyrmy-edge
name: Edge
tagline: HTTPS hostnames for every app, at home and away
icon: https://raw.githubusercontent.com/traefik/traefik/master/docs/content/assets/img/traefik.logo.png
category: networking
version: "0.4.1"
port: 18080
description: >-
  Gives every app on this Umbrel its own hostname under bebitwise.dev, with a
  Let's Encrypt certificate. At home the name resolves to a Traefik proxy on
  192.168.10.4. Away, it goes through a Cloudflare Tunnel behind Cloudflare
  Access.


  Routes, UniFi DNS records, tunnel hostnames and Access applications follow
  the installed apps automatically. Configuration lives in edge.yaml in the
  app's data folder.


  This page is the Traefik dashboard.
developer: vyrmy
website: https://github.com/vyrmy/umbrel-edge
submitter: vyrmy
submission: https://github.com/vyrmy/umbrel-edge
repo: https://github.com/vyrmy/umbrel-edge
support: https://github.com/vyrmy/umbrel-edge/issues
gallery: []
releaseNotes: >-
  Traefik and the tunnel connector now get only their own token from
  secrets.env, and Traefik no longer sees the rest of Edge's data folder. Its
  certificate moves to data/acme, copied across on the first start. The Umbrel
  dashboard is no longer published outside your network by default: if your
  edge.yaml has its own external_deny list, add umbrel to it, or set
  apps.umbrel.external to keep the dashboard public. Forward auth now replaces
  every X-authentik header a visitor sends, and Traefik refuses paths with
  encoded backslashes, semicolons or null characters.
dependencies: []
path: "/dashboard/"
defaultUsername: ""
defaultPassword: ""
