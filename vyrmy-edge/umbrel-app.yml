manifestVersion: 1
id: vyrmy-edge
name: Edge
tagline: HTTPS hostnames for every app, at home and away
icon: https://raw.githubusercontent.com/traefik/traefik/master/docs/content/assets/img/traefik.logo.png
category: networking
version: "0.5.0"
port: 18080
description: >-
  Gives every app on this Umbrel its own hostname under bebitwise.dev, with a
  Let's Encrypt certificate. At home the name resolves to a Traefik proxy on
  192.168.10.4. Away, it goes through a Cloudflare Tunnel behind Cloudflare
  Access.


  Routes, UniFi DNS records, tunnel hostnames and Access applications follow
  the installed apps automatically. Configuration lives in edge.yaml in the
  app's data folder.


  This page is the Traefik dashboard.
developer: vyrmy
website: https://github.com/vyrmy/umbrel-edge
submitter: vyrmy
submission: https://github.com/vyrmy/umbrel-edge
repo: https://github.com/vyrmy/umbrel-edge
support: https://github.com/vyrmy/umbrel-edge/issues
gallery: []
releaseNotes: >-
  The tunnel now has its own way into Traefik, so each app answers only
  where its settings say. An app with internal: false no longer opens at
  home or over the VPN, only through Cloudflare. An app with external:
  false cannot be reached through the tunnel, even if its hostname is added
  to the tunnel by hand. If Uptime Kuma or anything else at home checks an
  app that has internal: false, set internal: true for it first.


  Edge's own network moves to 10.30.0.0/24 on the first start after this
  update. If Cloudflare hostnames show errors afterwards, restart Edge.
dependencies: []
path: "/dashboard/"
defaultUsername: ""
defaultPassword: ""
