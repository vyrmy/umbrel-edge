name: desktop

# Builds ghcr.io/vyrmy/umbrel-desktop and pins every Desktop app to it (decision 16).
# The weekly run is what keeps Chromium patched and Signal working: Signal Desktop
# refuses to run once a build is about 90 days old.
on:
  push:
    branches: [main]
    paths:
      - desktop/**
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - desktop/**
      - .github/workflows/desktop.yml
  schedule:
    # Mondays 05:00 UTC, after linuxserver's weekend rebuilds.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: desktop
          platforms: linux/amd64
          # Always fetch the newest Webtop base, and never reuse a cached Signal install.
          pull: true
          no-cache: true
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/vyrmy/umbrel-desktop:main
            ghcr.io/vyrmy/umbrel-desktop:sha-${{ github.sha }}
      - name: Check Chromium, Signal and the wrappers are in the image
        env:
          IMAGE: ${{ github.event_name == 'pull_request' && 'ghcr.io/vyrmy/umbrel-desktop:main' || format('ghcr.io/vyrmy/umbrel-desktop@{0}', steps.build.outputs.digest) }}
        run: |
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c '
            set -e
            dpkg-query -W chromium signal-desktop
            test -x /opt/Signal/signal-desktop
            test -x /usr/local/bin/wrapped-signal
            test -x /usr/local/bin/wrapped-chromium
            grep -q "^Exec=/usr/local/bin/wrapped-signal" /usr/share/applications/signal-desktop.desktop
            if grep -q -- "--no-sandbox" /usr/share/applications/signal-desktop.desktop; then
              echo "Signal menu entry still forces --no-sandbox"; exit 1
            fi
            ls /etc/xdg/autostart/chromium-browser.desktop /etc/xdg/autostart/signal-desktop.desktop
          '

  pin:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: scripts/pin-desktop-image "${{ needs.image.outputs.digest }}"
      - name: Commit the new pin
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Pin the desktop image built on $(date -u '+%-d %B %Y')"
          git pull --rebase origin main
          git push origin HEAD:main
