name: desktop

# Builds ghcr.io/vyrmy/umbrel-desktop and pins every Desktop app to it (decision 16).
# The weekly run is what keeps Chromium patched and Signal working: Signal Desktop
# refuses to run once a build is about 90 days old.
on:
  push:
    branches: [main]
    paths:
      - desktop/**
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - desktop/**
      - .github/workflows/desktop.yml
  schedule:
    # Mondays 05:00 UTC, after linuxserver's weekend rebuilds.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: desktop
          platforms: linux/amd64
          # Always fetch the newest Webtop base, and never reuse a cached Signal install.
          pull: true
          no-cache: true
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/vyrmy/umbrel-desktop:main
            ghcr.io/vyrmy/umbrel-desktop:sha-${{ github.sha }}
      - name: Check Chromium, Signal, WhatsApp and the wrappers are in the image
        env:
          IMAGE: ${{ github.event_name == 'pull_request' && 'ghcr.io/vyrmy/umbrel-desktop:main' || format('ghcr.io/vyrmy/umbrel-desktop@{0}', steps.build.outputs.digest) }}
        run: |
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c '
            set -e
            dpkg-query -W chromium signal-desktop
            test -x /opt/Signal/signal-desktop
            test -x /usr/local/bin/wrapped-signal
            test -x /usr/local/bin/wrapped-chromium
            test -x /usr/local/bin/wrapped-whatsapp
            grep -q "^Exec=/usr/local/bin/wrapped-whatsapp$" /usr/share/applications/whatsapp-web.desktop
            grep -q "^Exec=/usr/local/bin/wrapped-whatsapp --after-browser$" /etc/xdg/autostart/whatsapp-web.desktop
            grep -q "^Exec=/usr/local/bin/wrapped-signal" /usr/share/applications/signal-desktop.desktop
            if grep -q -- "--no-sandbox" /usr/share/applications/signal-desktop.desktop; then
              echo "Signal menu entry still forces --no-sandbox"; exit 1
            fi
            ls /etc/xdg/autostart/chromium-browser.desktop /etc/xdg/autostart/signal-desktop.desktop /etc/xdg/autostart/whatsapp-web.desktop
          '

  pin:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: scripts/pin-desktop-image "${{ needs.image.outputs.digest }}"
      - name: Commit the new pin
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Pin the desktop image built on $(date -u '+%-d %B %Y')"
          git pull --rebase origin main
          git push origin HEAD:main
